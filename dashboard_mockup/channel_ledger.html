*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);font:14px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
h1,h2,h3,p{margin:0}

/* ---------- masthead ---------- */
.top{background:var(--surface);border-bottom:1px solid var(--hair)}
.top-in{max-width:1240px;margin:0 auto;padding:14px 20px 0;display:flex;align-items:flex-end;justify-content:space-between;gap:10px 28px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;padding-bottom:12px}
.brand svg{display:block}
.brand b{font-size:17px;font-weight:700;letter-spacing:-.01em}
.brand .src{font:11px var(--mono);color:var(--muted);padding-left:12px;margin-left:2px;border-left:1px solid var(--hair)}
.tag{font:500 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border:1px solid var(--hair);border-radius:3px;padding:2px 6px}
.tabs{display:flex;gap:4px;overflow-x:auto;max-width:100%;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px 12px;color:var(--muted);font-weight:500;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}

/* ---------- filter bar ---------- */
.filters{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--hair)}
.filters-in{max-width:1240px;margin:0 auto;padding:10px 20px;display:flex;flex-wrap:wrap;gap:10px 26px;align-items:center}
.fg{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.fl{font:500 10.5px var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--hair);border-radius:5px;padding:2px;background:var(--chip);gap:2px}
.seg button{border:0;background:none;padding:4px 11px;border-radius:3px;color:var(--ink2);font-size:13px;font-weight:500}
.seg button:hover{background:var(--hair)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--hair);background:var(--chip);border-radius:999px;padding:3px 11px 3px 8px;font-size:13px;font-weight:500;color:var(--ink)}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--k);border:2px solid var(--k);box-sizing:border-box}
.chip[aria-pressed="false"]{color:var(--muted);background:transparent}
.chip[aria-pressed="false"] i{background:transparent}
.chip:hover{border-color:var(--axis)}
.fspacer{margin-left:auto}

/* ---------- page ---------- */
main{max-width:1240px;margin:0 auto;padding-inline:20px;padding-block:22px 40px}
.pagehead{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:4px 20px;margin-bottom:14px}
.pagehead h1{font-size:23px;font-weight:600;letter-spacing:-.015em;text-wrap:balance}
.pagehead .meta{font:12px var(--mono);color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px}
.s12{grid-column:span 12}.s7{grid-column:span 7}.s6{grid-column:span 6}.s5{grid-column:span 5}
@media (max-width:920px){.s7,.s6,.s5{grid-column:span 12}}

.card{background:var(--surface);border:1px solid var(--hair);border-radius:6px;padding:16px 18px 14px;min-width:0}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:6px 18px;flex-wrap:wrap;margin-bottom:10px}
.card h3{font-size:14px;font-weight:600;letter-spacing:-.005em}
.card .sub{font-size:12px;color:var(--muted);margin-top:1px}
.build{font:11px/1.4 var(--mono);color:var(--muted);margin-top:5px;max-width:64ch}
.build::before{content:"Tableau \00b7  ";color:var(--ink2);font-weight:500}
body.nobuild .build{display:none}
.body{min-width:0;position:relative}
.body svg{display:block;overflow:visible}
.legend{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:12px;color:var(--ink2);align-items:center}
.legend span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.legend i.ln{height:3px;width:14px;border-radius:2px}
.legend i.ring{background:var(--surface);border:2px solid var(--ink2);border-radius:50%;width:10px;height:10px;box-sizing:border-box}
.legend i.dot{border-radius:50%;background:var(--ink)}

/* svg text + strokes (all token-driven) */
.tick{font:11px var(--mono);fill:var(--muted);font-variant-numeric:tabular-nums}
.lab{font:500 13px var(--sans);fill:var(--ink)}
.val{font:600 12.5px var(--sans);fill:var(--ink);font-variant-numeric:tabular-nums}
.endlab{font:600 12px var(--sans);fill:var(--ink2);font-variant-numeric:tabular-nums}
.note-t{font:500 11.5px var(--sans);fill:var(--ink2)}
.grid-l{stroke:var(--grid);stroke-width:1}
.axis{stroke:var(--axis);stroke-width:1}
.refl{stroke:var(--ink2);stroke-width:1}
.xhl{stroke:var(--ink2);stroke-width:1}
.link{stroke:var(--axis);stroke-width:3;stroke-linecap:round}
.hit{fill:transparent;outline:none;cursor:default}
.hit:focus-visible{stroke:var(--ink);stroke-width:1.5px}
.cols.dim .col{opacity:.42}
.cols.dim .col.on{opacity:1}
.h0{fill:var(--grid)}
.h1{fill:var(--seq1)}.h2{fill:var(--seq2)}.h3{fill:var(--seq3)}.h4{fill:var(--seq4)}.h5{fill:var(--seq5)}.h6{fill:var(--seq6)}.h7{fill:var(--seq7)}
.t0{fill:var(--muted)}
.t1{fill:var(--on1)}.t2{fill:var(--on2)}.t3{fill:var(--on3)}.t4{fill:var(--on4)}.t5{fill:var(--on5)}.t6{fill:var(--on6)}.t7{fill:var(--on7)}
.htxt{font:600 12px var(--sans);font-variant-numeric:tabular-nums}
.cell:hover rect.hc,.cell:focus rect.hc{stroke:var(--ink);stroke-width:1.5px}
.scale{display:flex;align-items:center;gap:8px;margin-top:10px;font:11px var(--mono);color:var(--muted)}
.scale .sw{display:flex;gap:2px}
.scale .sw i{width:26px;height:8px;border-radius:2px;display:block}
.sw1{background:var(--seq1)}.sw2{background:var(--seq2)}.sw3{background:var(--seq3)}.sw4{background:var(--seq4)}.sw5{background:var(--seq5)}.sw6{background:var(--seq6)}.sw7{background:var(--seq7)}

/* ---------- KPI strip: one band, hairline dividers ---------- */
.kpis{display:grid;gap:1px;background:var(--hair);border:1px solid var(--hair);border-radius:6px;overflow:hidden;margin-bottom:12px}
.kpis.six{grid-template-columns:1.55fr repeat(5,minmax(0,1fr))}
@media (max-width:1020px){.kpis.six{grid-template-columns:repeat(3,minmax(0,1fr))}.kpis.six .hero{grid-column:1/-1}}
@media (max-width:620px){.kpis.six{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);padding:14px 16px 12px;min-width:0}
.kl{font-size:12px;color:var(--muted);font-weight:500}
.kv{font-size:27px;font-weight:600;letter-spacing:-.02em;line-height:1.15;margin-top:2px}
.hero .kv{font-size:clamp(48px,6vw,58px);font-weight:600;letter-spacing:-.03em;line-height:1.05;margin-top:4px}
.kd{font-size:12px;margin-top:3px;color:var(--ink2);min-height:18px;font-variant-numeric:tabular-nums}
.kd .muted{color:var(--muted)}
.gl{font-size:9px;margin-right:3px;position:relative;top:-1px}
.gl.good{color:var(--good)}.gl.bad{color:var(--serious)}.gl.flat{color:var(--muted)}
.ks{margin-top:8px;height:30px}
.hero .ks{height:38px}

/* ---------- tables ---------- */
.tblwrap{overflow-x:auto}
table.tbl{border-collapse:collapse;width:100%;font-size:13px}
.tbl th{font:500 10.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:right;padding:6px 12px;border-bottom:1px solid var(--axis);white-space:nowrap}
.tbl td{padding:9px 12px;text-align:right;border-bottom:1px solid var(--grid);font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left;padding-left:2px}
.tbl tr.total td{font-weight:600;border-bottom:0;border-top:1px solid var(--axis)}
.tbl td .sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:8px;vertical-align:-1px}
.tbl td .gl{margin-left:6px;margin-right:2px}

/* tooltip */
#tip{position:fixed;left:0;top:0;z-index:50;pointer-events:none;background:var(--tip-bg);color:var(--tip-fg);border-radius:5px;padding:8px 10px;font-size:12px;min-width:120px;max-width:260px;box-shadow:0 4px 14px rgba(0,0,0,.22)}
#tip[hidden]{display:none}
#tip .tt{font-weight:600;margin-bottom:4px;opacity:.9}
#tip .tr{display:flex;align-items:center;gap:7px;line-height:1.55}
#tip .tr i{width:9px;height:9px;border-radius:2px;flex:none}
#tip .tr i.ln{height:3px;width:12px}
#tip .tl{flex:1;opacity:.72}
#tip .tr b{font-weight:600;font-variant-numeric:tabular-nums;margin-left:10px}

/* footer */
.foot{margin-top:18px;display:grid;gap:10px;font-size:12px;color:var(--muted);max-width:92ch}
.foot p b{color:var(--ink2);font-weight:600}
details.calc{border:1px solid var(--hair);border-radius:6px;background:var(--surface);padding:10px 14px}
details.calc summary{cursor:pointer;font-weight:600;color:var(--ink);font-size:13px}
details.calc dl{display:grid;grid-template-columns:max-content 1fr;gap:6px 18px;margin:12px 0 2px;overflow-x:auto}
details.calc dt{font-weight:600;color:var(--ink2)}
details.calc dd{margin:0;font:11.5px var(--mono);color:var(--ink2);white-space:nowrap}
@media (prefers-reduced-motion:no-preference){.cols .col{transition:opacity .12s}}
</style>

  </div>
</div>

const M=D.months, CH=D.channels, NM=M.length, NC=CH.length;
const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ---------- data model ---------- */
const P=Array.from({length:NM},()=>Array(NC).fill(null));
D.perf.forEach(r=>{P[r[0]][r[1]]={spend:r[2],rev:r[3],orders:r[4],sess:r[5],bnc:r[6]}});

function tot(a,b,chs){
  const t={spend:0,rev:0,orders:0,sess:0,bnc:0,rr:0,rs:0,ro:0};
  for(let m=a;m<=b;m++)for(const c of chs){const p=P[m][c];if(!p)continue;
    t.rev+=p.rev;t.orders+=p.orders;t.sess+=p.sess;t.bnc+=p.bnc;
    if(p.spend!=null){t.spend+=p.spend;t.rs+=p.spend;t.rr+=p.rev;t.ro+=p.orders}}
  t.hasSpend=t.rs>0;
  t.roas=t.rs?t.rr/t.rs:null; t.cpo=t.ro?t.rs/t.ro:null;
  t.aov=t.orders?t.rev/t.orders:null; t.cvr=t.sess?t.orders/t.sess:null;
  t.bounce=t.sess?t.bnc/t.sess:null; t.rps=t.sess?t.rev/t.sess:null;
  return t;
}

const fMoney0=v=>'$'+Math.round(v).toLocaleString('en-US');
const fPct=v=>(v*100).toFixed(1)+'%';

function axisMoney(v){if(v===0)return '$0';if(v>=1e6)return '$'+(v/1e6)+'M';if(v>=1e3)return '$'+(v/1e3)+'K';return '$'+v}

function niceTicks(max,count){
  count=count||4; if(!(max>0))return [0,1];
  const raw=max/count,p=Math.pow(10,Math.floor(Math.log10(raw))),f=raw/p;
  const step=(f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p;
  const t=[0]; while(t[t.length-1]<max-1e-9)t.push(+(t[t.length-1]+step).toFixed(10));
  return t;
}

/* ---------- tooltip ---------- */
const tip=document.getElementById('tip');
function tipShow(x,y,title,rows){
  tip.replaceChildren();
  const t=document.createElement('div');t.className='tt';t.textContent=title;tip.append(t);
  rows.forEach(r=>{
    const d=document.createElement('div');d.className='tr';
    if(r.color){const k=document.createElement('i');k.style.background=r.color;if(r.line)k.className='ln';d.append(k)}
    const l=document.createElement('span');l.className='tl';l.textContent=r.label;
    const v=document.createElement('b');v.textContent=r.value;
    d.append(l,v);tip.append(d);
  });
  tip.hidden=false;
  const w=tip.offsetWidth,h=tip.offsetHeight;
  let px=x+14,py=y+14;
  if(px+w>innerWidth-8)px=x-w-14;
  if(py+h>innerHeight-8)py=y-h-14;
  tip.style.transform='translate('+Math.max(8,px)+'px,'+Math.max(8,py)+'px)';
}
const tipHide=()=>{tip.hidden=true};
function bindTip(node,get){
  node.addEventListener('pointermove',e=>{const g=get(e);tipShow(e.clientX,e.clientY,g[0],g[1])});
  node.addEventListener('pointerleave',tipHide);
  node.addEventListener('focus',()=>{const b=node.getBoundingClientRect(),g=get(null);tipShow(b.left+b.width/2,b.top,g[0],g[1])});
  node.addEventListener('blur',tipHide);
}

/* ---------- chart primitives (all SVG, token-colored) ---------- */
function xEvery(n,iw){const step=iw/Math.max(1,n-1);return Math.max(1,Math.ceil(48/step))}

function lineChart(el,o){
  const w=o.w,h=o.h,labels=o.labels,series=o.series,vFmt=o.vFmt,yFmt=o.yFmt||o.vFmt,compact=!!o.compact;
  const m=compact?{l:4,r:8,t:8,b:4}:{l:50,r:56,t:14,b:26};
  const iw=Math.max(10,w-m.l-m.r),ih=h-m.t-m.b,n=labels.length;
  const vals=series.flatMap(s=>s.values).filter(v=>v!=null);
  const dmax=o.yMax!=null?o.yMax:(Math.max.apply(null,vals)||1);
  const ticks=compact?[0,dmax]:niceTicks(dmax,4),top=ticks[ticks.length-1]||1;
  const X=i=>m.l+(n<2?iw/2:i*iw/(n-1)),Y=v=>m.t+ih-(v/top)*ih;
  let g='';
  if(!compact){
    ticks.forEach(t=>{g+='<line class="grid-l" x1="'+m.l+'" x2="'+(w-m.r)+'" y1="'+Y(t)+'" y2="'+Y(t)+'"/><text class="tick" x="'+(m.l-9)+'" y="'+(Y(t)+4)+'" text-anchor="end">'+yFmt(t)+'</text>'});
    g+='<line class="axis" x1="'+m.l+'" x2="'+(w-m.r)+'" y1="'+Y(0)+'" y2="'+Y(0)+'"/>';
    const ev=xEvery(n,iw);
    labels.forEach((l,i)=>{if(i%ev===0)g+='<text class="tick" x="'+X(i)+'" y="'+(h-6)+'" text-anchor="middle">'+l+'</text>'});
  }
  series.forEach(s=>{
    const pts=s.values.map((v,i)=>v==null?null:[X(i),Y(v)]);
    let d='',pen=false;
    pts.forEach(p=>{if(!p){pen=false;return}d+=(pen?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1);pen=true});
    const real=pts.filter(Boolean); if(!real.length)return;
    if(s.area)g+='<path d="'+d+' L'+real[real.length-1][0].toFixed(1)+','+Y(0)+' L'+real[0][0].toFixed(1)+','+Y(0)+' Z" style="fill:'+s.color+';opacity:.10"/>';
    g+='<path d="'+d+'" fill="none" style="stroke:'+s.color+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
    const lp=real[real.length-1],lv=s.values.filter(v=>v!=null).pop();
    g+='<circle cx="'+lp[0]+'" cy="'+lp[1]+'" r="4" style="fill:'+s.color+';stroke:var(--surface)" stroke-width="2"/>';
    if(!compact)g+='<text class="endlab" x="'+(lp[0]+10)+'" y="'+(lp[1]+4)+'">'+vFmt(lv)+'</text>';
  });
  g+='<g class="xh" style="display:none"><line class="xhl" y1="'+m.t+'" y2="'+(m.t+ih)+'" x1="0" x2="0"/>'+series.map(s=>'<circle class="xd" r="4.5" style="fill:'+s.color+';stroke:var(--surface)" stroke-width="2"/>').join('')+'</g>';
  g+='<rect class="hit" tabindex="0" x="'+(m.l-6)+'" y="'+m.t+'" width="'+(iw+12)+'" height="'+ih+'" role="img" aria-label="'+(o.aria||'Line chart')+'. Use left and right arrow keys to read values."/>';
  el.innerHTML='<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'">'+g+'</svg>';
  const svg=el.firstChild,hit=svg.querySelector('.hit'),xh=svg.querySelector('.xh'),xhl=xh.querySelector('.xhl'),dots=[].slice.call(xh.querySelectorAll('.xd'));
  let cur=n-1;
  const setIdx=i=>{cur=i;const x=X(i);xhl.setAttribute('x1',x);xhl.setAttribute('x2',x);
    dots.forEach((d,k)=>{const v=series[k].values[i];if(v==null){d.style.display='none'}else{d.style.display='';d.setAttribute('cx',x);d.setAttribute('cy',Y(v))}});xh.style.display=''};
  const rows=()=>series.map(s=>({color:s.color,line:true,label:s.label,value:s.values[cur]==null?dash:vFmt(s.values[cur])}));
  const title=i=>o.tipTitle?o.tipTitle(i):labels[i];
  const atKey=()=>{const r=svg.getBoundingClientRect();tipShow(r.left+X(cur),r.top+m.t+16,title(cur),rows())};
  hit.addEventListener('pointermove',e=>{const r=svg.getBoundingClientRect();setIdx(clamp(Math.round((e.clientX-r.left-m.l)/iw*(n-1)),0,n-1));tipShow(e.clientX,e.clientY,title(cur),rows())});
  hit.addEventListener('pointerleave',()=>{xh.style.display='none';tipHide()});
  hit.addEventListener('focus',()=>{setIdx(cur);atKey()});
  hit.addEventListener('blur',()=>{xh.style.display='none';tipHide()});
  hit.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();setIdx(clamp(cur+(e.key==='ArrowRight'?1:-1),0,n-1));atKey()}});
}

function stackedCols(el,o){
  const w=o.w,h=o.h,labels=o.labels,chs=o.chs,vals=o.vals;
  const m={l:50,r:10,t:22,b:26},iw=Math.max(10,w-m.l-m.r),ih=h-m.t-m.b,n=labels.length;
  const totals=vals.map(r=>chs.reduce((s,c)=>s+r[c],0));
  const ticks=niceTicks(Math.max.apply(null,totals),4),top=ticks[ticks.length-1]||1;
  const Y=v=>m.t+ih-(v/top)*ih,band=iw/n,bw=clamp(band*0.7,6,24);
  let g='';
  ticks.forEach(t=>{g+='<line class="grid-l" x1="'+m.l+'" x2="'+(w-m.r)+'" y1="'+Y(t)+'" y2="'+Y(t)+'"/><text class="tick" x="'+(m.l-9)+'" y="'+(Y(t)+4)+'" text-anchor="end">'+axisMoney(t)+'</text>'});
  g+='<line class="axis" x1="'+m.l+'" x2="'+(w-m.r)+'" y1="'+Y(0)+'" y2="'+Y(0)+'"/>';
  const ev=Math.max(1,Math.ceil(48/band));
  labels.forEach((l,i)=>{if(i%ev===0)g+='<text class="tick" x="'+(m.l+band*i+band/2)+'" y="'+(h-6)+'" text-anchor="middle">'+l+'</text>'});
  g+='<g class="cols">';
  const peak=totals.indexOf(Math.max.apply(null,totals));
  for(let i=0;i<n;i++){
    const x0=m.l+band*i+(band-bw)/2;let cum=0;
    const lastC=chs.filter(c=>vals[i][c]>0).pop();
    g+='<g class="col" data-i="'+i+'">';
    chs.forEach(c=>{
      const v=vals[i][c];if(v<=0)return;
      const yTop=Y(cum+v),yBot=Y(cum);let hh=yBot-yTop-(cum>0?2:0);if(hh<1)hh=1;
      if(c===lastC){const r=Math.min(3,hh);g+='<path d="M'+x0+','+(yTop+hh)+' V'+(yTop+r)+' Q'+x0+','+yTop+' '+(x0+r)+','+yTop+' H'+(x0+bw-r)+' Q'+(x0+bw)+','+yTop+' '+(x0+bw)+','+(yTop+r)+' V'+(yTop+hh)+' Z" style="fill:var(--c'+(c+1)+')"/>'}
      else g+='<rect x="'+x0+'" y="'+yTop+'" width="'+bw+'" height="'+hh+'" style="fill:var(--c'+(c+1)+')"/>';
      cum+=v;
    });
    g+='</g>';
  }
  g+='</g>';
  if(n>3)g+='<text class="note-t" x="'+clamp(m.l+band*peak+band/2,m.l+34,w-m.r-34)+'" y="'+(Y(totals[peak])-8)+'" text-anchor="middle">Peak '+fMoney(totals[peak])+'</text>';
  for(let i=0;i<n;i++)g+='<rect class="hit" data-i="'+i+'" tabindex="0" x="'+(m.l+band*i)+'" y="'+m.t+'" width="'+band+'" height="'+ih+'" role="img" aria-label="'+labels[i]+'"/>';
  el.innerHTML='<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'">'+g+'</svg>';
  const svg=el.firstChild,colsG=svg.querySelector('.cols'),cols=[].slice.call(svg.querySelectorAll('.col'));
  svg.querySelectorAll('.hit').forEach(hit=>{
    const i=+hit.getAttribute('data-i');
    const get=()=>[(o.tipTitle?o.tipTitle(i):labels[i])+'  ·  '+fMoney(totals[i]),chs.slice().reverse().map(c=>({color:'var(--c'+(c+1)+')',label:CH[c],value:fMoney(vals[i][c])}))];
    const on=()=>{colsG.classList.add('dim');cols[i].classList.add('on')};
    const off=()=>{colsG.classList.remove('dim');cols[i].classList.remove('on')};
    hit.addEventListener('pointerenter',on);hit.addEventListener('focus',on);
    hit.addEventListener('pointerleave',off);hit.addEventListener('blur',off);
    bindTip(hit,get);
  });
}

  const prev=r.cmp?tot(r.a-12,r.b-12,chs):null;
  const K=[
    {k:'rev',l:'Revenue',f:fMoney,good:1,hero:1},{k:'spend',l:'Spend',f:fMoney,good:0},{k:'roas',l:'ROAS',f:fX,good:1},
    {k:'orders',l:'Orders',f:fInt,good:1},{k:'aov',l:'Avg order value',f:fMoney0,good:1},{k:'cvr',l:'Conversion rate',f:fPct,good:1}
  ];
  const strip=document.createElement('div');strip.className='kpis six';
  K.forEach(kp=>{
    const v=cur[kp.k],pv=prev?prev[kp.k]:null,d=(pv&&v!=null)?v/pv-1:null;
    let dh;
    if(d==null)dh='<span class="muted">'+mfull(r.a)+' – '+mfull(r.b)+'</span>';
    else{const up=d>=0,cls=kp.good?(up?'good':'bad'):'flat';
      dh='<span class="gl '+cls+'" role="img" aria-label="'+(up?'up':'down')+'">'+(up?'▲':'▼')+'</span>'+Math.abs(d*100).toFixed(1)+'% <span class="muted">'+r.cmp+'</span>'}
    const t=document.createElement('div');t.className='kpi'+(kp.hero?' hero':'');
    t.innerHTML='<div class="kl">'+kp.l+'</div><div class="kv">'+opt(v,kp.f)+'</div><div class="kd">'+dh+'</div><div class="ks"></div>';
    strip.append(t);
    draws.push(()=>{const box=t.querySelector('.ks');spark(box,monthlySeries(chs,kp.k),Math.floor(box.clientWidth),kp.hero?38:30)});
  });
  root.append(strip);
  const grid=document.createElement('div');grid.className='grid';root.append(grid);
  const labs=monthLabels(),fullLabs=()=>{const a=[];for(let m=r.a;m<=r.b;m++)a.push(mfull(m));return a};
  const revS=monthlySeries(chs,'rev'),spS=monthlySeries(chs,'spend'),roS=monthlySeries(chs,'roas');
  grid.append(makeCard({title:'Revenue and spend by month',sub:'One dollar axis, so the gap between the lines is the margin over spend.',span:'s7',
    legend:legLn([['Revenue','var(--ink)'],['Spend','var(--slate)']]),
    build:'Line · Columns MONTH(month_start) · Rows Measure Values (revenue, spend) on one axis',
    chart:(el,w)=>lineChart(el,{w:w,h:250,labels:labs,tipTitle:i=>fullLabs()[i],vFmt:fMoney,yFmt:axisMoney,aria:'Revenue and spend by month',
      series:[{label:'Revenue',color:'var(--ink)',values:revS,area:true},{label:'Spend',color:'var(--slate)',values:spS}]}),
    table:()=>({head:['Month','Revenue','Spend'],rows:fullLabs().map((l,i)=>[l,fMoney0(revS[i]),fMoney0(spS[i])])})}).valueOf());
  grid.append(makeCard({title:'ROAS by month',sub:'Revenue per dollar of spend, all selected channels.',span:'s5',
    build:'Line · Columns MONTH(month_start) · Rows [ROAS] calculated field',
    chart:(el,w)=>lineChart(el,{w:w,h:250,labels:labs,tipTitle:i=>fullLabs()[i],vFmt:fX,yFmt:v=>v.toFixed(0)+'x',aria:'ROAS by month',yMax:Math.max.apply(null,roS.filter(v=>v!=null))*1.05,
      series:[{label:'ROAS',color:'var(--ink)',values:roS}]}),
    table:()=>({head:['Month','ROAS'],rows:fullLabs().map((l,i)=>[l,opt(roS[i],fX)])})}));
  const vals=[];for(let m=r.a;m<=r.b;m++)vals.push(CH.map((_,c)=>chs.includes(c)&&P[m][c]?P[m][c].rev:0));
  grid.append(makeCard({title:'Revenue by channel',sub:'Monthly revenue stacked by the channel on the order.',span:'s12',legend:legCh(chs),
    build:'Stacked bar · Columns MONTH(month_start) · Rows SUM(revenue) · Color channel (fixed palette)',
    chart:(el,w)=>stackedCols(el,{w:w,h:270,labels:labs,tipTitle:i=>fullLabs()[i],chs:chs,vals:vals}),
    table:()=>({head:['Month'].concat(chs.map(c=>CH[c]),['Total']),rows:fullLabs().map((l,i)=>[l].concat(chs.map(c=>fMoney0(vals[i][c])),[fMoney0(chs.reduce((s,c)=>s+vals[i][c],0))]))})}));
  return noSpendNote+'<p><b>Comparison.</b> Deltas compare the same months a year earlier, so seasonality does not read as growth. They appear for H1 2026 and Last 3 months; earlier periods have no prior year in the file.</p>';
}

function chRows(chs){const r=rg();return chs.map(c=>Object.assign({c:c},tot(r.a,r.b,[c])))}

function buildChannels(root,chs){
  const r=rg(),all=tot(r.a,r.b,chs),rows=chRows(chs);
  const grid=document.createElement('div');grid.className='grid';root.append(grid);
  const byRoas=rows.filter(x=>x.roas!=null).sort((a,b)=>b.roas-a.roas);
  grid.append(makeCard({title:'ROAS by channel',sub:'Revenue per dollar of spend. The line is the average for the selected channels.',span:'s6',
    build:'Bar · Rows channel · Columns [ROAS] · Reference line: average, per pane',
    chart:(el,w)=>hBars(el,{w:w,max:Math.max(all.roas||0,byRoas[0]?byRoas[0].roas:1)*1.12,fmt:fX,ref:all.roas,refLabel:'Avg '+fX(all.roas||0),tipLabel:'ROAS',
      rows:byRoas.map(x=>({label:CH[x.c],value:x.roas,color:chColor(x.c),tip:[{label:'ROAS',value:fX(x.roas)},{label:'Spend',value:fMoney0(x.spend)},{label:'Revenue',value:fMoney0(x.rev)},{label:'Cost per order',value:opt(x.cpo,fMoney0)}]}))}),
    table:()=>({head:['Channel','ROAS'],rows:byRoas.map(x=>[CH[x.c],fX(x.roas)])})}));
  const sp=rows.reduce((s,x)=>s+x.spend,0),rv=rows.reduce((s,x)=>s+x.rev,0);
  const db=rows.map(x=>({label:CH[x.c],a:sp?x.spend/sp:0,b:rv?x.rev/rv:0,color:chColor(x.c)})).sort((a,b)=>b.b-a.b);
  grid.append(makeCard({title:'Share of spend vs share of revenue',sub:'A filled dot to the right of the hollow one means the channel earns more than it costs.',span:'s6',
    legend:'<span><i class="ring"></i>Share of spend</span><span><i class="dot"></i>Share of revenue</span>',
    build:'Dot plot · Rows channel · Columns % of Total SUM(spend), % of Total SUM(revenue) · connect with a line',
    chart:(el,w)=>dumbbell(el,{w:w,rows:db,max:Math.max(0.5,Math.ceil(Math.max.apply(null,db.map(d=>Math.max(d.a,d.b)))*10)/10)}),
    table:()=>({head:['Channel','Share of spend','Share of revenue'],rows:db.map(d=>[d.label,fPct(d.a),fPct(d.b)])})}));
  const sorted=rows.slice().sort((a,b)=>b.rev-a.rev);
  const scoreTable=()=>{
    const head=['Channel','Spend','Revenue','ROAS','vs avg','Cost / order','AOV','Conv. rate','Bounce','Rev / session'];
    const line=x=>{
      let vs=dash;if(x.roas!=null&&all.roas!=null){const d=x.roas-all.roas,up=d>=0;vs='<span class="gl '+(up?'good':'bad')+'" role="img" aria-label="'+(up?'above':'below')+' average">'+(up?'▲':'▼')+'</span>'+Math.abs(d).toFixed(2)+'x'}
      return [x.c==null?'All selected':'<span class="sw" style="background:'+chColor(x.c)+'"></span>'+CH[x.c],x.hasSpend?fMoney0(x.spend):dash,fMoney0(x.rev),opt(x.roas,fX),x.c==null?dash:vs,opt(x.cpo,fMoney0),opt(x.aov,fMoney0),opt(x.cvr,fPct),opt(x.bounce,fPct),opt(x.rps,v=>'$'+v.toFixed(2))];
    };
    return {head:head,rows:sorted.map(line).concat([Object.assign(line(Object.assign({c:null},all)),{})].map(c=>({cells:c,total:true})))};
  };
  grid.append(makeCard({title:'Channel scorecard',sub:'Every efficiency measure side by side, sorted by revenue.',span:'s12',
    build:'Text table · Rows channel · one column per calculated field · Total row via Analysis › Totals',
    chart:(el)=>{const t=scoreTable();el.innerHTML=tableHTML(t.head,t.rows)},table:scoreTable}));
  const q0=Math.floor(r.a/3),q1=Math.floor(r.b/3),qs=[];for(let q=q0;q<=q1;q++)qs.push(q);
  const hv=chs.map(c=>qs.map(q=>tot(Math.max(q*3,r.a),Math.min(q*3+2,r.b),[c]).roas));
  grid.append(makeCard({title:'ROAS by quarter',sub:'Darker is better. Channel rankings barely move from quarter to quarter.',span:'s12',
    build:'Highlight table · Rows channel · Columns QUARTER(month_start) · Color [ROAS] (sequential blue, 0–6)',
    chart:(el,w)=>heatmap(el,{w:w,rows:chs.map(c=>CH[c]),cols:qs.map(qlab),vals:hv,fmt:fX,scaleMax:6,lo:'0x',hi:'6x+',
      tipFn:(i,j)=>[CH[chs[i]]+' · '+qlab(qs[j]),[{label:'ROAS',value:opt(hv[i][j],fX)}]]}),
    table:()=>({head:['Channel'].concat(qs.map(qlab)),rows:chs.map((c,i)=>[CH[c]].concat(hv[i].map(v=>opt(v,fX))))})}));
  return noSpendNote+'<p><b>Average vs marginal.</b> These are average returns. A channel with a high ROAS on a small budget will not necessarily hold that return if its spend grows.</p>';
}

/* ---------- shell ---------- */
const CALC=[
  ['ROAS','SUM(IF [spend_missing]=0 THEN [revenue] END) / SUM([spend])'],
  ['Cost per order','SUM([spend]) / SUM(IF [spend_missing]=0 THEN [orders] END)'],
  ['Avg order value','SUM([revenue]) / SUM([orders])'],
  ['Conversion rate','SUM([orders]) / SUM([sessions])'],
  ['Bounce rate','SUM([bounced_sessions]) / SUM([sessions])'],
  ['Revenue / session','SUM([revenue]) / SUM([sessions])']
];
function render(){
  tipHide();draws=[];
  const chs=selChs(),pg=PAGES.find(p=>p.id===S.page),r=rg();
  document.getElementById('tabs').innerHTML=PAGES.map(p=>'<button class="tab" role="tab" data-p="'+p.id+'" aria-selected="'+(p.id===S.page)+'">'+p.label+'</button>').join('');
  document.getElementById('f-range').innerHTML=RANGES.map(x=>'<button data-r="'+x.id+'" aria-pressed="'+(x.id===S.range)+'">'+x.label+'</button>').join('');
  document.getElementById('f-ch').innerHTML=CH.map((n,i)=>'<button class="chip" data-c="'+i+'" style="--k:'+chColor(i)+'" aria-pressed="'+S.chs.has(i)+'"><i></i>'+n+'</button>').join('');
  document.getElementById('f-view').innerHTML='<button data-v="chart" aria-pressed="'+(S.view==='chart')+'">Charts</button><button data-v="table" aria-pressed="'+(S.view==='table')+'">Tables</button>';
  document.getElementById('f-notes').innerHTML='<button data-n="1" aria-pressed="'+S.notes+'" title="Show how each chart is built in Tableau">Build notes</button>';
  document.body.classList.toggle('nobuild',!S.notes);
  document.getElementById('ph-title').textContent=pg.q;
  document.getElementById('ph-meta').textContent=mfull(r.a)+' – '+mfull(r.b)+'  ·  '+chs.length+' of '+NC+' channels';
  const root=document.getElementById('page');root.replaceChildren();
  const foot=({overview:buildOverview,channels:buildChannels})[S.page](root,chs);
  document.getElementById('foot').innerHTML=foot+'<details class="calc"><summary>Calculated fields used in this workbook</summary><dl>'+CALC.map(c=>'<dt>'+c[0]+'</dt><dd>'+c[1]+'</dd>').join('')+'</dl></details>';
  drawAll();
}
function drawAll(){draws.forEach(d=>d())}

document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.p){S.page=b.dataset.p;render();window.scrollTo(0,0);return}
  if(b.dataset.r){S.range=b.dataset.r;render();return}
  if(b.dataset.v){S.view=b.dataset.v;render();return}
  if(b.dataset.n){S.notes=!S.notes;render();return}
  if(b.dataset.c!==undefined&&b.classList.contains('chip')){
    const c=+b.dataset.c;
    if(S.chs.has(c)){if(S.chs.size>1)S.chs.delete(c)}else S.chs.add(c);
    render();
  }
});
let lastW=0,raf=0;
new ResizeObserver(()=>{const w=document.getElementById('page').clientWidth;if(w===lastW)return;lastW=w;cancelAnimationFrame(raf);raf=requestAnimationFrame(drawAll)}).observe(document.getElementById('page'));
try{const hp=location.hash.slice(1);if(PAGES.some(p=>p.id===hp))S.page=hp}catch(e){}
render();
})();
</script>
